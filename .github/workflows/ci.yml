name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JDK 25, Maven 4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 and Maven 4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # 本项目使用 Maven 4（无 wrapper），见 AGENTS.md / CONTRIBUTING.md。
          # 若 setup-java 暂未收录该具体版本，可改为 '4' 或显式安装 Maven 4 的步骤。
          maven-version: '4.0.0'
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Build and verify
        run: mvn -B verify

      - name: Upload build artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
