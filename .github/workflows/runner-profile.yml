name: Runner Profile Verification

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner profile to compile and test
        required: true
        type: choice
        options:
          - flink
          - spark

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify selected runner profile
        run: mvn -B -P${{ inputs.runner }}-runner verify
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.runner }}-runner-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
