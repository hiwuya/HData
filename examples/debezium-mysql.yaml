# Use Debezium's embedded engine to capture MySQL binlog changes, mapping each table's
# insert/update/delete event to a row (op / key / before / after / source / ts_ms).
# This continuously captures the change stream rather than reading the full table snapshot.
#
# Run (requires a reachable MySQL with binlog enabled):
#   MYSQL_PASSWORD=xxx java -cp 'hdata-core/target/classes:hdata-debezium/target/classes:...' \
#     me.jayer.hdata.core.HData --pipeline=examples/debezium-mysql.yaml

pipeline:
  type: chain

  source:
    type: ReadFromDebezium
    config:
      connector: mysql
      host: "127.0.0.1"
      port: 3306
      user: "${MYSQL_USER:-root}"
      password: "${MYSQL_PASSWORD}"
      database: "demo"
      table_include: "demo\\.t_user"
      snapshot_mode: "initial"
      # Required for an unbounded (streaming) CDC job: point these at durable storage that survives a
      # restart or a move to a different worker, or the job can silently repeat or skip changes. For a
      # throwaway local run only, replace both with `allow_ephemeral_state: true`.
      offset_file: "/var/lib/hdata/debezium-mysql/offsets.dat"
      schema_history_file: "/var/lib/hdata/debezium-mysql/schema-history.dat"

  transforms:
    # Keep only records carrying an after-image, then project the JSON payload into typed columns.
    # Delete events have after: null and can be routed to a separate pipeline when needed.
    - type: Filter
      name: KeepAfterImage
      config:
        field: op
        operator: in
        values: [c, r, u]
    - type: JsonToFields
      name: ProjectAfter
      config:
        field: after
        fields: ["id:long", "name:string"]
        drop_input: true
    - type: LogForTesting
      name: Print
      config:
        level: INFO
        prefix: "cdc: "

execution:
  mode: streaming

options:
  runner: DirectRunner
