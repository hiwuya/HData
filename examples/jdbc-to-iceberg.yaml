# Sync a MySQL table into Iceberg (warehouse uses a local directory for demo; in production use an
# HDFS/S3 path).
#
# Run:
#   MYSQL_PASSWORD=xxx java -cp 'hdata-core/target/classes:hdata-jdbc/target/classes:hdata-iceberg/target/classes:...' \
#     me.jayer.hdata.core.HData --pipeline=examples/jdbc-to-iceberg.yaml

pipeline:
  type: chain

  source:
    type: ReadFromJdbc
    config:
      url: "jdbc:mysql://127.0.0.1:3306/demo?useSSL=false"
      user: "${MYSQL_USER:-root}"
      password: "${MYSQL_PASSWORD}"
      tables: ["t_user"]

  transforms:
    - type: WriteToIceberg
      name: UsersToIceberg
      config:
        warehouse: "/tmp/iceberg-wh"
        table: "db.users"
        schema_fields:
          - "id:INT64"
          - "name:STRING"
          - "age:INT32"

options:
  runner: DirectRunner
