# 最典型的一张表同步到另一张表。
#
# 运行：
#   MYSQL_PASSWORD=xxx java -cp 'hdata-core/target/classes:hdata-jdbc/target/classes:...' \
#     me.jayer.hdata.core.HData --pipeline=examples/jdbc-to-jdbc.yaml
#
# 密码之类的敏感信息用变量占位符从环境变量或 -D 系统属性注入，别写进文件。
# 注意变量替换是在解析前对整个文件做的文本替换，注释里也会生效。

pipeline:
  type: chain

  source:
    type: ReadFromJdbc
    config:
      url: "jdbc:mysql://127.0.0.1:3306/demo?useSSL=false&yearIsDateType=false&tinyInt1isBit=false"
      user: "${MYSQL_USER:-root}"
      password: "${MYSQL_PASSWORD}"
      tables: ["t_order"]
      where: "created_at >= '2022-01-01'"
      # 不填 partition_column 时会自动尝试主键；partition_num 不填则按取值范围估算
      partition_column: "id"
      partition_num: 8
      fetch_size: 10000

  transforms:
    - type: MapToFields
      name: Rename
      config:
        fields:
          order_id: id
          user_id: uid
          amount: total_amount
          created_at: created_at

  sink:
    type: WriteToJdbc
    config:
      url: "jdbc:mysql://127.0.0.1:3306/dw?useSSL=false"
      user: "${MYSQL_USER:-root}"
      password: "${MYSQL_PASSWORD}"
      table: "dws_order"
      batch_size: 5000

options:
  runner: DirectRunner
