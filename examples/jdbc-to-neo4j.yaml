# Sync a MySQL table into Neo4j (create one :User node per user).
#
# Run:
#   MYSQL_PASSWORD=xxx NEO4J_PASSWORD=xxx java -cp 'hdata-core/target/classes:hdata-jdbc/target/classes:hdata-neo4j/target/classes:...' \
#     me.jayer.hdata.core.HData --pipeline=examples/jdbc-to-neo4j.yaml
#
# Writing uses a single Cypher statement; $name / $age auto-bind to the same-named row fields;
# to rename, use `parameters` to explicitly map cypher parameter -> row field.

pipeline:
  type: chain

  source:
    type: ReadFromJdbc
    config:
      url: "jdbc:mysql://127.0.0.1:3306/demo?useSSL=false"
      user: "${MYSQL_USER:-root}"
      password: "${MYSQL_PASSWORD}"
      tables: ["t_user"]

  transforms:
    - type: WriteToNeo4j
      name: UsersToGraph
      config:
        uri: "bolt://127.0.0.1:7687"
        user: "${NEO4J_USER:-neo4j}"
        password: "${NEO4J_PASSWORD:-neo4j}"
        statement: 'MERGE (u:User {id: $id}) SET u.name = $name, u.age = $age'

options:
  runner: DirectRunner
