# 把一张 MySQL 表同步进 Redis（set 模式：SET key value）。
#
# 运行：
#   MYSQL_PASSWORD=xxx java -cp 'hdata-core/target/classes:hdata-jdbc/target/classes:hdata-redis/target/classes:...' \
#     me.jayer.hdata.core.HData --pipeline=examples/jdbc-to-redis.yaml
#
# 密码用变量占位符，从环境变量或 -D 系统属性注入，别写进文件。

pipeline:
  type: chain

  source:
    type: ReadFromJdbc
    config:
      url: "jdbc:mysql://127.0.0.1:3306/demo?useSSL=false"
      user: "${MYSQL_USER:-root}"
      password: "${MYSQL_PASSWORD}"
      tables: ["t_user"]

  transforms:
    - type: WriteToRedis
      name: CacheUsers
      config:
        # key 用 user:<id>，value 是整个记录序列化后的字符串（这里只取 name 字段做演示）
        mode: set
        key_field: "id"
        value_field: "name"
        # 缓存 1 小时
        ttl_seconds: 3600

options:
  runner: DirectRunner
